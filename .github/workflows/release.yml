name: Build and publish Spectrum Manager
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore dependencies
        run: nuget restore 'RBX Alt Manager.sln'
      - name: Build application and regression tests
        run: msbuild 'Tests/RegressionTests.csproj' /t:Build /p:Configuration=Debug /p:PostBuildEvent= /p:GenerateResourceUsePreserializedResources=true /verbosity:minimal
      - name: Regression checks
        run: '& "build/Tests/SurgeeRegressionTests.exe"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
      - name: Extension checks
        run: node --test Tests/extension.test.mjs
      - name: Cross-architecture updater checks
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          & $compiler /nologo /platform:x64 /out:build/Tests/ProcessProbe64.exe Tests/ProcessArchitectureSmoke.cs 'RBX Alt Manager/Classes/UpdateParentProcess.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /platform:x86 /out:build/Tests/UpdateWait32.exe Tests/ProcessArchitectureSmoke.cs 'RBX Alt Manager/Classes/UpdateParentProcess.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Tests/UpdateWait32.exe ./build/Tests/ProcessProbe64.exe 64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Tests/ProcessProbe64.exe ./build/Tests/UpdateWait32.exe 32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package release
        shell: pwsh
        run: |
          $version = (Get-Content 'RBX Alt Manager/Classes/ManagerUpdates.cs' -Raw | Select-String 'const string Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne ('v' + $version)) { throw 'Git tag and application version must match.' }
          ./scripts/package.ps1 -Version $version
          $extensionVersion = (Get-Content 'Browser Extension/manifest.json' -Raw | ConvertFrom-Json).version
          "<!-- surgee-extension:$extensionVersion -->`n`nDownload Spectrum-Manager ZIP or Spectrum-Browser-Extension.zip. Existing users can update inside the manager. Extension 0.4.0+ supports in-extension updates through the open manager. Source code remains available in this repository under GPL-3.0." | Set-Content build/release-notes.md -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Spectrum-release
          path: build/artifacts/*.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'This release is already published; keeping its verified assets.'
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME build/artifacts/*.zip --repo $env:GITHUB_REPOSITORY --title "Spectrum Manager $env:GITHUB_REF_NAME" --notes-file build/release-notes.md --verify-tag
          exit $LASTEXITCODE
